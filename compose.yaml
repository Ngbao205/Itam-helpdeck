services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: itam_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: itam_helpdesk
      DB_USERNAME: itam
      DB_PASSWORD: itam123

  mysql:
    image: mysql:8.4
    container_name: itam_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: itam_helpdesk
      MYSQL_USER: itam
      MYSQL_PASSWORD: itam123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: